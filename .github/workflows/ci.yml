# Continuous checks that run on ordinary pushes and pull requests.
# Releasing is handled separately by release.yml, which triggers only on tags.
name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

jobs:

  lint:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7

      - name: Install Lua and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      # Configuration lives in .luacheckrc at the repo root, so a local
      # `luacheck .` reproduces this exactly.
      - name: Run luacheck
        run: luacheck . --no-color

      # A malformed .xml is not a load error -- WoW logs a LUA_WARNING and
      # silently skips every <Script> in the file. That took out all locale
      # loading once, and the only visible symptom was English rendering
      # correctly because every call site has an inline English fallback.
      # An XML comment containing "--" is the easiest way to cause it.
      - name: Validate XML
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = False
          for path in sorted(glob.glob('**/*.xml', recursive=True)):
              try:
                  ET.parse(path)
              except ET.ParseError as err:
                  print("::error file=%s::%s" % (path, err))
                  bad = True
          sys.exit(1 if bad else 0)
          PY

  package:
    name: Packager dry run
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -d builds the package without uploading anywhere, so a broken .pkgmeta
      # or TOC is caught here instead of at tag time.
      - name: Package (no upload)
        uses: BigWigsMods/packager@v2
        with:
          args: -d
